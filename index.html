<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">

<title>ポケカ未開封BOX 棚卸し</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif}
main{max-width:760px;margin:auto;padding:18px 14px 38px}h1{font-size:22px;margin:0 0 4px}.sub,.meta,.source,.note,.label{color:#6b7280;font-size:12px}.sub{margin-bottom:16px}
.tools{display:grid;grid-template-columns:1fr 130px;gap:9px}label{font-size:12px;color:#4b5563}input,select{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid #d1d5db;border-radius:12px;background:#fff;font-size:16px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px}.value{font-size:20px;font-weight:700;margin-top:3px}
.list{display:flex;flex-direction:column;gap:8px}.row{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.name{font-size:15px;font-weight:650}.year{font-size:11px;background:#eef2ff;border-radius:99px;padding:2px 6px;margin-left:4px}.price{font-weight:650}.actions{display:flex;align-items:center;gap:6px;margin-top:8px}button{min-width:38px;height:36px;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-size:20px}.num{min-width:28px;text-align:center;font-weight:700}.source{margin-top:3px}.note{line-height:1.55;margin-top:14px}
.bottom{margin-top:14px}.bottom button{width:100%;font-size:14px}.check{display:flex;align-items:center;gap:7px;margin:9px 0}.check input{width:auto;margin:0}
@media(max-width:560px){.summary{grid-template-columns:1fr 1fr}.summary .card:last-child{grid-column:1/-1}}
</style></head><body><main>
<h1>ポケカ未開封BOX 棚卸し</h1><div class="sub">2018年以降｜在庫・買取目安・資産評価</div>
<div class="tools"><label style="grid-column:1/-1">商品名<input id="q" placeholder="例：フュージョン、151、イーブイ"></label>
<label>発売年<select id="year"><option value="all">すべて</option><option>2026</option><option>2025</option><option>2024</option><option>2023</option><option>2022</option><option>2021</option><option>2020</option><option>2019</option><option>2018</option></select></label>
<label>並び順<select id="sort"><option value="year">発売年順</option><option value="price">買取目安が高い順</option><option value="owned">所有数が多い順</option></select></label></div>
<label class="check"><input id="hide0" type="checkbox"> 所有数0のBOXを非表示</label>
<div class="summary"><div class="card"><div class="label">総BOX数</div><div id="total" class="value">0</div></div><div class="card"><div class="label">所有タイトル数</div><div id="titles" class="value">0</div></div><div class="card"><div class="label">買取評価額</div><div id="asset" class="value">¥0</div></div></div>
<div id="list" class="list"></div><div id="empty" style="text-align:center;color:#6b7280;padding:24px" hidden>該当するBOXがありません。</div>
<div class="note">価格は未開封・シュリンク付きBOXを前提とした参考値です。価格は変動します。各BOXに調査日・参考ショップを表示します。「未取得」は推定値を入れず、裏取り待ちです。</div>
<div class="bottom"><button id="reset">個数をすべて0に戻す</button></div>
</main>
<script>

8000, "トレカの地図", "2026/7/27"], [2022, "ロストアビス", 41667, "トレカの地図", "2026/7/27"], [2022, "白熱のアルカナ", 8933, "トレカの地図", "2026/7/27"], [2021, "25th ANNIVERSARY COLLECTION", 72000, "買取ホムラ", "2026/8/10"], [2021, "VMAXクライマックス", 29333, "トレカの地図", "2026/7/27"], [2021, "イーブイヒーローズ", 146500, "買取ホムラ", "2026/8/10"], [2021, "フュージョンアーツ", 50000, "買取ホムラ / もえたく！", "2026/7/30"], [2021, "一撃マスター", 28333, "トレカの地図", "2026/7/27"], [2021, "双璧のファイター", 29000, "トレカの地図", "2026/7/27"], [2021, "摩天パーフェクト", 57667, "トレカの地図", "2026/7/27"], [2021, "漆黒のガイスト", 26333, "トレカの地図", "2026/7/27"], [2021, "白銀のランス", 16500, "トレカの地図", "2026/7/27"], [2021, "蒼空ストリーム", 285000, "買取ホムラ", "2026/8/10"], [2021, "連撃マスター", 38667, "トレカの地図", "2026/7/27"], [2020, "VMAXライジング", null, "未取得", "—"], [2020, "シャイニースターV", null, "未取得", "—"], [2020, "ムゲンゾーン", null, "未取得", "—"], [2020, "仰天のボルテッカー", null, "未取得", "—"], [2020, "伝説の鼓動", null, "未取得", "—"], [2020, "反逆クラッシュ", null, "未取得", "—"], [2020, "爆炎ウォーカー", null, "未取得", "—"], [2019, "オルタージェネシス", null, "未取得", "—"], [2019, "シールド", null, "未取得", "—"], [2019, "ジージーエンド", null, "未取得", "—"], [2019, "スカイレジェンド", null, "未取得", "—"], [2019, "ソード", null, "未取得", "—"], [2019, "ダブルブレイズ", null, "未取得", "—"], [2019, "ドリームリーグ", null, "未取得", "—"], [2019, "リミックスバウト", null, "未取得", "—"], [2018, "ウルトラフォース", null, "未取得", "—"], [2018, "タッグボルト", null, "未取得", "—"], [2018, "ダークオーダー", null, "未取得", "—"], [2018, "ドラゴンストーム", null, "未取得", "—"], [2018, "フェアリーライズ", null, "未取得", "—"], [2018, "禁断の光", null, "未取得", "—"], [2018, "裂空のカリスマ", null, "未取得", "—"], [2018, "超爆インパクト", null, "未取得", "—"], [2018, "迅雷スパーク", null, "未取得", "—"]];
const C=Array(D.length).fill(0);
try{const s=JSON.parse(localStorage.getItem("pokecaCounts")||"null");if(Array.isArray(s))s.forEach((v,i)=>{if(i<C.length)C[i]=Math.max(0,Number(v)||0)})}catch(e){}
const q=document.getElementById("q"),year=document.getElementById("year"),sort=document.getElementById("sort"),hide0=document.getElementById("hide0"),list=document.getElementById("list");
const yen=v=>v==null?"未取得":"¥"+v.toLocaleString();
function save(){localStorage.setItem("pokecaCounts",JSON.stringify(C))}
function summary(){let t=0,n=0,v=0;C.forEach((c,i)=>{t+=c;if(c>0)n++;if(D[i][2]!=null)v+=c*D[i][2]});document.getElementById("total").textContent=t;document.getElementById("titles").textContent=n;document.getElementById("asset").textContent="¥"+v.toLocaleString()}
function render(){
 let a=D.map((p,i)=>({p,i})), y=year.value, s=q.value.trim().toLowerCase();
 if(y!=="all")a=a.filter(x=>String(x.p[0])===y);
 if(s)a=a.filter(x=>x.p[1].toLowerCase().includes(s));
 if(hide0.checked)a=a.filter(x=>C[x.i]>0);
 if(sort.value==="price")a.sort((x,z)=>(z.p[2]??-1)-(x.p[2]??-1));
 else if(sort.value==="owned")a.sort((x,z)=>C[z.i]-C[x.i]);
 else a.sort((x,z)=>z.p[0]-x.p[0]||x.p[1].localeCompare(z.p[1],"ja"));
 list.innerHTML="";
 a.forEach(({p,i})=>{
   const r=document.createElement("div");r.className="row";
   r.innerHTML='<div><div class="name">'+p[1]+' <span class="year">'+p[0]+'</span></div>'+
   '<div class="meta">買取目安：<b>'+yen(p[2])+'</b>　評価額：<b>'+(p[2]==null?"—":yen(p[2]*C[i]))+'</b></div>'+
   '<div class="source">調査日：'+p[4]+'　｜ 参考ショップ：'+p[3]+'</div>'+
   '<div class="actions"><button data-m="'+i+'">−</button><div class="num">'+C[i]+'</div><button data-p="'+i+'">＋</button></div></div>';
   list.appendChild(r);
 });
 document.getElementById("empty").hidden=a.length>0;summary()
}
list.addEventListener("click",e=>{const p=e.target.closest("[data-p]"),m=e.target.closest("[data-m]");if(p)C[+p.dataset.p]++;if(m){const i=+m.dataset.m;C[i]=Math.max(0,C[i]-1)}save();render()});
q.addEventListener("input",render);year.addEventListener("change",render);sort.addEventListener("change",render);hide0.addEventListener("change",render);
document.getElementById("reset").addEventListener("click",()=>{if(confirm("個数をすべて0に戻しますか？")){C.fill(0);save();render()}});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
render();
</script></body></html>
