name: Update Pokeca Prices

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2,6,9 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/update_prices.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="price-live.js"></script>'
          if marker not in s:
              s=s.replace('</body>', marker+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prices.json index.html
          git diff --cached --quiet || git commit -m 'chore: update pokeca buy prices'
          git push
